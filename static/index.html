<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แผนที่จากหมุด V2</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font-family:system-ui,sans-serif;margin:0;background:#f2f5fa;color:#17304d}header{background:#173e69;color:white;padding:20px}main{max-width:950px;margin:auto;padding:16px}.card{background:white;border-radius:15px;padding:18px;margin-bottom:15px;box-shadow:0 2px 12px #0001}input{width:100%;box-sizing:border-box;padding:14px;font-size:16px;border:1px solid #aaa;border-radius:8px}button,select{padding:12px;border-radius:8px;border:1px solid #bbc8d7;font-size:16px;margin:5px 5px 5px 0}button{background:#1865a4;color:white;border:0;cursor:pointer}#map{height:460px;border-radius:10px}label{display:inline-block;margin:8px}small{color:#53677b}#status{min-height:24px;color:#9b4227}@media(max-width:600px){#map{height:390px}}</style></head><body><header><h2>📍 แผนที่จากหมุด Google Maps V2</h2>ถนน • ดาวเทียม • รัศมี • ส่งออกภาพ / PDF</header><main><section class="card"><label for="url">วางลิงก์ Google Maps หรือพิกัด lat,lng</label><input id="url" placeholder="https://maps.app.goo.gl/..." value="https://maps.app.goo.gl/oZkWv2jJuLNQDwx8A?g_st=ac"><button id="go">แสดงหมุด</button><button id="clear">ล้างหมุด</button><p id="status" role="status"></p></section><section class="card"><label>ประเภทแผนที่ <select id="layer"><option value="road">ถนน</option><option value="sat">ดาวเทียม</option></select></label><label>รัศมี <select id="radius"><option value="0">ไม่มี</option><option value="100">100 เมตร</option><option value="500" selected>500 เมตร</option><option value="1000">1 กิโลเมตร</option><option value="5000">5 กิโลเมตร</option></select></label><label><input id="showPin" type="checkbox" checked style="width:auto"> แสดงหมุด</label><button id="png">บันทึก PNG</button><button id="pdf">พิมพ์ / PDF</button><p id="coords"></p><div id="map"></div><small>แผนที่ถนน © OpenStreetMap contributors | ดาวเทียม © Esri และผู้ให้ข้อมูล | โปรดตรวจสอบสิทธิ์การนำภาพไปใช้ การส่งออกอาจถูกจำกัดโดยผู้ให้บริการแผนที่</small></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script>const map=L.map('map').setView([12.61,102.10],12);const road=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles © Esri'});let marker=null,circle=null,point=null;const $=id=>document.getElementById(id);function draw(){if(marker)map.removeLayer(marker);if(circle)map.removeLayer(circle);if(!point)return;marker=L.marker(point);if($('showPin').checked)marker.addTo(map);let r=Number($('radius').value);if(r)circle=L.circle(point,{radius:r,color:'#2466ac',fillOpacity:.12}).addTo(map);map.setView(point,r>=5000?11:r>=1000?13:15);$('coords').textContent='พิกัด: '+point.join(', ')}$('go').onclick=async()=>{const v=$('url').value.trim();$('status').textContent='กำลังอ่านลิงก์...';try{let res=await fetch('/api/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:v})});let d=await res.json();if(!res.ok)throw Error(d.error||'เกิดข้อผิดพลาด');point=[d.lat,d.lng];draw();$('status').textContent='แสดงตำแหน่งเรียบร้อย'}catch(e){$('status').textContent=e.message}};$('clear').onclick=()=>{point=null;if(marker)map.removeLayer(marker);if(circle)map.removeLayer(circle);marker=circle=null;$('coords').textContent='';$('status').textContent='ล้างหมุดแล้ว'};$('layer').onchange=()=>{map.removeLayer(road);map.removeLayer(sat);($('layer').value==='sat'?sat:road).addTo(map)};$('radius').onchange=draw;$('showPin').onchange=draw;$('png').onclick=async()=>{try{const canvas=await html2canvas($('map'),{useCORS:true,allowTaint:false});const a=document.createElement('a');a.download='map.png';a.href=canvas.toDataURL('image/png');a.click()}catch(e){$('status').textContent='ไม่สามารถบันทึกภาพได้ เนื่องจากข้อจำกัดการเข้าถึงภาพแผนที่'}};$('pdf').onclick=()=>window.print();</script><style>@media print{header,.card:first-child,button,select,label{display:none!important}main{padding:0}.card{box-shadow:none}#map{height:680px}}</style></body></html>
